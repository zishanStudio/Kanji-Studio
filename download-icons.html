<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nihonify — 1-Tap Icon &amp; Manifest Downloader</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; }
    body {
      margin: 0;
      padding: 20px;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    .preview {
      width: 112px;
      height: 112px;
      border-radius: 26px;
      margin: 0 auto 14px;
      box-shadow: 0 10px 26px rgba(0,0,0,0.45);
      display: block;
    }
    h1 { margin: 0 0 6px; font-size: 19px; }
    p { margin: 0 0 18px; font-size: 12px; color: #94a3b8; line-height: 1.5; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .btn {
      display: block;
      width: 100%;
      padding: 13px 16px;
      border-radius: 14px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: 0.15s;
    }
    .btn-primary { background: #4f46e5; color: #ffffff; }
    .btn-primary:hover { background: #4338ca; }
    .btn-teal { background: #0f766e; color: #ffffff; }
    .btn-slate { background: #334155; color: #f8fafc; }
    .note {
      margin-top: 14px;
      font-size: 11px;
      color: #94a3b8;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 10px 12px;
      line-height: 1.5;
    }
  </style>
</head>
